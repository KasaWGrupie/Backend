services:
  kasawgrupie.api:
    image: ${DOCKER_REGISTRY-}kasawgrupieapi
    container_name: kasawgrupie.api
    build:
      context: .
      dockerfile: KasaWGrupieBackend/Dockerfile
    env_file:
        - .env
    environment:
        - AzureDocumentIntelligence__Endpoint=${AZURE_DOC_INTEL_ENDPOINT}
        - AzureDocumentIntelligence__ApiKey=${AZURE_DOC_INTEL_KEY}
    depends_on: 
        - kasawgrupie.database
  kasawgrupie.database:
    image: postgres:latest
    container_name: kasawgrupie.database
    environment:
        - POSTGRES_DB=kasawgrupie
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
    volumes:
        - ./.containers/kasawgrupie-db:/var/lib/postgresql/data
    ports:
        - 5432:5432


  tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src/KasaWGrupieBackendTests
    volumes:
      - ./:/src
    env_file:
      - .env
    command: bash -c "
      dotnet restore KasaWgrupie.Tests.csproj &&
      dotnet test    KasaWgrupie.Tests.csproj \
        --no-build \
        --filter \"FullyQualifiedName~ReceiptProcessorTests\" \
        --verbosity detailed"
    
    
